<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
</head>
<body>
    <h1>Your Cart</h1>
    <p><a href="{{ url_for('index') }}">Continue Shopping</a> | <a href="{{ url_for('logout') }}">Logout</a></p>
    <hr>
    {% if cart %}
        <ul>
            {% for item in cart %}
                <li>{{ item.name }} - ${{ item.price }}</li>
            {% endfor %}
        </ul>
        <h3>Total: ${{ total }}</h3>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}
</body>
</html>
