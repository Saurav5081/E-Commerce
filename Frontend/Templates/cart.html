<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h1>Your Cart</h1>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
        </nav>
    </header>

    <main>
        {% if cart %}
            <ul>
                {% for item in cart %}
                <li>{{ item.name }} - ${{ item.price }}</li>
                {% endfor %}
            </ul>
            <h3>Total: ${{ total }}</h3>
        {% else %}
            <p>Your cart is empty.</p>
        {% endif %}
    </main>
</body>
</html>
